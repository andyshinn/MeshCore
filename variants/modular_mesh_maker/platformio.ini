; MCU-agnostic MMM settings. Split out of [modular_mesh_maker] so the nRF54
; section can reuse them without inheriting the nRF52 platform base.
[mmm_common]
build_flags =
  -I variants/modular_mesh_maker
  -D MANUFACTURER_STRING='"Modular Mesh Maker"'
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
build_src_filter =
  +<helpers/sensors>
  +<../variants/modular_mesh_maker>
lib_deps =
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library@^2.6.8

; nRF52 flavour of the above. Expands to exactly what it did before the
; [mmm_common] split, so the four existing envs are unaffected.
[modular_mesh_maker]
build_flags = ${nrf52_base.build_flags}
  ${mmm_common.build_flags}
build_src_filter = ${nrf52_base.build_src_filter}
  ${mmm_common.build_src_filter}
lib_deps= ${nrf52_base.lib_deps}
  ${mmm_common.lib_deps}

[mmm_promicro]
extends = nrf52_base
board = promicro_nrf52840
build_src_filter = ${modular_mesh_maker.build_src_filter}
build_flags = ${modular_mesh_maker.build_flags}
  -D PROMICRO
  -D P_LORA_POWER_EN=2
  -D P_LORA_DIO_1=11
  -D P_LORA_NSS=13
  -D P_LORA_SCLK=12
  -D P_LORA_MOSI=14
  -D P_LORA_MISO=15
  -D P_LORA_RESET=10
  -D P_LORA_BUSY=16
  -D PIN_BOARD_SCL=7
  -D PIN_BOARD_SDA=8
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=6
; GPS RX and TX are defined backwards by Meshcore
; PIN_GPS_RX is output to GPS uart
; PIN_GPS_TX is input from GPS uart
  -D PIN_GPS_RX=4
  -D PIN_GPS_TX=3
  -D PIN_GPS_EN=5
  -D GPS_BAUD_RATE=115200
  -D ENV_INCLUDE_GPS=1
lib_deps = ${modular_mesh_maker.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6

[mmm_xiaonrf52]
extends = nrf52_base
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_src_filter = ${modular_mesh_maker.build_src_filter}
build_flags = ${modular_mesh_maker.build_flags}
  -D NRF52_PLATFORM
  -D XIAO_NRF52
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I src/helpers/nrf52
  -D P_LORA_TX_LED=D11
  -D DISPLAY_CLASS=SSD1306Display
  -D DISPLAY_ROTATION=2
  -D P_LORA_DIO_1=1
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=3
  -D P_LORA_NSS=4
  -D P_LORA_POWER_EN=5
  -D PIN_USER_BTN=0
  -D PIN_WIRE_SCL=7
  -D PIN_WIRE_SDA=6
  -UENV_INCLUDE_GPS
lib_deps = ${modular_mesh_maker.lib_deps}

; EXPERIMENTAL / WORK IN PROGRESS. This env builds and links; it is not yet
; confirmed running on hardware. See [nrf54_base] in the root platformio.ini
; for the pinned fork branches.
;
; The XIAO nRF54LM20A drops into the same XIAO socket as the XIAO nRF52840, so
; every carrier-side pin below is identical to [mmm_xiaonrf52] on purpose --
; those numbers are MMM board wiring keyed to XIAO silkscreen positions D0..D10,
; not MCU pins. Only the MCU-side mapping in variant.cpp changes.
;
; Deltas from the nRF52 XIAO that ARE handled:
;   - battery: the LM20A XIAO has no GPIO divider, so VBAT comes from its
;     nPM1300 PMIC over I2C (P1.18/P1.17, addr 0x6B). The Arduino core exposes
;     that private bus as Wire1 on TWIM24; src/helpers/NPM1300.cpp drives it.
;   - no display: these envs have no OLED, so DISPLAY_CLASS is left undefined.
;
; Known deltas that are NOT yet handled:
;   - BLE: -I src/helpers/nrf52 pulls in SerialBLEInterface, which is written
;     against the nRF52 Bluefruit API. Needs an nRF54 equivalent.
;   - no SoftDevice include path yet (S145 vs the nRF52 S140 paths above)
[mmm_xiao_nrf54lm20a]
extends = nrf54_base
board = xiao_nrf54lm20a
build_src_filter = ${nrf54_base.build_src_filter}
  ${mmm_common.build_src_filter}
build_flags = ${nrf54_base.build_flags}
  ${mmm_common.build_flags}
  -D XIAO_NRF54LM20A
  -D P_LORA_DIO_1=1
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=3
  -D P_LORA_NSS=4
  -D P_LORA_POWER_EN=5
  -D PIN_USER_BTN=0
  -UENV_INCLUDE_GPS
lib_deps = ${nrf54_base.lib_deps}
  ${mmm_common.lib_deps}

[mmm_lr2021]
extends = modular_mesh_maker
build_src_filter = ${modular_mesh_maker}
build_flags =
  -D USE_LR2021
  -D RADIO_CLASS=CustomLR2021
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D LR2021_IRQ_DIO=9
  -D LR2021_TCXO_VOLTAGE=3.3f
  -D RF_SWITCH_TABLE
  -D LORA_TX_POWER=5

[mmm_e22p]
extends = modular_mesh_maker
build_src_filter = ${modular_mesh_maker}
build_flags =
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_POWER_EN=D5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=18

[env:mmm_promicro_e22p_repeater]
extends = mmm_promicro
build_src_filter = ${modular_mesh_maker.build_src_filter}
  ${mmm_promicro.build_src_filter}
  ${mmm_e22p.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
build_flags =
  ${modular_mesh_maker.build_flags}
  ${mmm_promicro.build_flags}
  ${mmm_e22p.build_flags}
  -D ADVERT_NAME='"Modular Mesh Maker Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${modular_mesh_maker.lib_deps}
  ${mmm_promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3


