[env:mmm_xiao_nrf54lm20a_lr2021_repeater]
extends = mmm_xiao_nrf54lm20a
build_src_filter = ${mmm_xiao_nrf54lm20a.build_src_filter}
  ${mmm_lr2021.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/MomentaryButton.cpp>
build_flags =
  ${mmm_xiao_nrf54lm20a.build_flags}
  ${mmm_lr2021.build_flags}
  -D ADVERT_NAME='"Modular Mesh Maker Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
  ; upload the Semtech LR2021 firmware patch (PRAM) at boot - opt-in per env, and
  ; deliberately not in [mmm_lr2021], which is shared with the nRF52 XIAO/ProMicro envs
  -D LR2021_LOAD_PRAM=1

  ; ---------------------------------------------------------------------------
  ; Battery charging, via the XIAO nRF54LM20A's on-board nPM1300 PMIC.
  ;
  ; SHIPPED OFF ON PURPOSE. The nPM1300 resets with its charger disabled (32 mA,
  ; 3.60 V termination), and with the macros below left commented out MeshCore
  ; actively switches the charger OFF at every boot, so a cell on the BAT pads
  ; never charges. It has to write that, rather than just leave the part alone:
  ; the PMIC powers the MCU and does not reset when the MCU does, so a build
  ; that once had these macros would otherwise keep charging forever, straight
  ; through a reflash. Deleting the macros really is the off-switch.
  ; There is no safe default charge current for a capacity nobody has stated.
  ;
  ; BATT_CAPACITY_MAH is the rated capacity of the cell YOU fitted, in mAh. The
  ; firmware charges at 0.5C derived from it, clamped down to a 150 mA board
  ; ceiling, and terminates at 4.15 V (Seeed's own figure for this module; the
  ; usual 4.20 V is given up because this board cannot derate termination in the
  ; heat -- see MMMBoard.h). Termination is fixed in MMMBoard.h and is
  ; deliberately not settable here: chemistry on these boards is always LiPo.
  ; Below 64 mAh the build fails, because 0.5C would be under the part's 32 mA
  ; floor and the only way to "fix" that would be to charge the cell harder.
  ;
  ; BATT_CHARGE_WITHOUT_TEMPERATURE_SENSING is a second, deliberately awkward
  ; opt-in, and the build will not compile with capacity set and this missing or
  ; set to anything but exactly 1. Setting it to 0 does NOT turn charging off --
  ; remove BATT_CAPACITY_MAH for that.
  ; This board CANNOT measure cell temperature: the nPM1300's NTC pin is wired
  ; to a fixed 10k resistor (Seeed XIAO nRF54LM20A V1.0 schematic, R6) that
  ; reads as a permanent 25 C (KNTCTEMP code 512), so the
  ; JEITA cold/hot cutoffs are defeated in copper, not in firmware. Charging
  ; here means charging a lithium cell with no cell-temperature protection.
  ; Only define it once you have confirmed the pack carries its own protection
  ; circuit INCLUDING a thermal fuse, which nPM1300 PS section 3.4 requires of
  ; any pack on VBAT when no thermistor is present. A bare unprotected pouch
  ; cell is not safe on this board.
  ;
  ; Opt-in per env, and deliberately not in [mmm_lr2021] (shared with the nRF52
  ; XIAO/ProMicro envs, which have no PMIC) nor in [mmm_xiao_nrf54lm20a] (shared
  ; with the e22p env, which need not carry the same cell).
  ; -D BATT_CAPACITY_MAH=500
  ; -D BATT_CHARGE_WITHOUT_TEMPERATURE_SENSING=1
  ; ---------------------------------------------------------------------------
lib_deps = ${mmm_xiao_nrf54lm20a.lib_deps}
  adafruit/RTClib @ ^2.1.3
